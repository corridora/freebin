services:
  freebin:
    build:
      context: ./src/site
      args:
        FREEBIN_GIT_COMMIT: "${FREEBIN_GIT_COMMIT:-}"
    ports:
      - "${FREEBIN_PORT:-8787}:8787"
    volumes:
      - freebin-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  freebin-data:
    name: freebin-data
