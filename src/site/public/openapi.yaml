openapi: 3.1.0
info:
  title: freebin.org API
  version: 1.0.0
  description: |-
    Manage bins and inspect captured development requests. Management endpoints are versioned under /api/v1. Capture endpoints use /b/{binId} with an optional path suffix and require an owner account API key; the designated public demo also accepts its deployment-configured demo key. Bin management accepts account API keys, browser sessions, and, where supported, anonymous inspector capabilities. Visiting the token-bearing anonymous inspectUrl exchanges that capability for a Secure, HttpOnly cookie scoped to the bin API and removes the token from the URL. Query tokens are not accepted directly on management APIs. JSON mutation requests with an Origin header must use the same origin as the service.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://freebin.org
security:
  - bearerAuth: []
tags:
  - name: Configuration
  - name: Authentication
  - name: Account
  - name: Bins
  - name: Requests
  - name: Sharing
  - name: Capture
paths:
  /api/config:
    get:
      tags: [Configuration]
      summary: Get public browser configuration
      description: Returns signup availability and public telemetry configuration. Secret server keys are never exposed.
      operationId: getPublicConfig
      security: []
      responses:
        "200":
          description: Public configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfig"
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register an account
      description: Registration must be enabled. A successful response starts a 30-day browser session.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          $ref: "#/components/responses/UserSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in
      description: Validates an email and password and starts a 30-day browser session.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          $ref: "#/components/responses/UserSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Sign out
      description: Deletes the current server session, when present, and clears its browser cookie.
      operationId: logout
      security:
        - cookieAuth: []
        - {}
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/me:
    get:
      tags: [Account]
      summary: Get the current account
      description: Returns account storage usage and both owned and shared bins. Signed-out callers receive a successful response with user set to null and an empty bins array.
      operationId: getCurrentAccount
      security:
        - cookieAuth: []
        - {}
      responses:
        "200":
          description: Current account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
    delete:
      tags: [Account]
      summary: Permanently delete the current account
      description: Deletes the signed-in account and clears its browser session.
      operationId: deleteCurrentAccount
      security:
        - cookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/account/token:
    get:
      tags: [Account]
      summary: List API keys
      description: Returns key metadata only; complete token values are never returned after creation.
      operationId: listApiKeys
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active API-key metadata
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [Account]
      summary: Create an API key
      description: Accounts may have five active API keys. The complete token is returned only in this response.
      operationId: createApiKey
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 60
                  default: API key
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                type: object
                required: [key, token]
                properties:
                  key:
                    $ref: "#/components/schemas/ApiKey"
                  token:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Account]
      summary: Revoke an API key
      operationId: revokeApiKey
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/bins:
    get:
      tags: [Bins]
      summary: List bins
      operationId: listBins
      responses:
        "200":
          description: Bins belonging to the authenticated user
          content:
            application/json:
              schema:
                type: object
                required: [bins]
                properties:
                  bins:
                    type: array
                    items:
                      $ref: "#/components/schemas/BinSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
      description: Requires a nonempty bearer credential. Account API keys list owned bins; anonymous bin-owner capabilities list their bin. Unrecognized nonempty credentials return an empty bins array. Browser sessions alone do not authenticate this endpoint.
    post:
      tags: [Bins]
      summary: Create a bin
      description: Creates a private bin for a bearer-key or browser-session user. Without either credential, creates a public anonymous bin that cannot capture requests.
      operationId: createBin
      security:
        - bearerAuth: []
        - cookieAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [termsAccepted]
              properties:
                name:
                  type: string
                  maxLength: 60
                termsAccepted:
                  type: boolean
                  const: true
      responses:
        "201":
          description: Bin created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBinResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Five-bin account limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/bins/{binId}:
    parameters:
      - $ref: "#/components/parameters/BinId"
    get:
      tags: [Bins]
      summary: Get bin configuration
      operationId: getBin
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      responses:
        "200":
          description: Bin configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  bin:
                    $ref: "#/components/schemas/Bin"
                required:
                  - bin
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      tags: [Bins]
      summary: Update response and forwarding settings
      description: Response body, content type, and serialized response headers are each limited to 500 UTF-8 bytes. Automatic forwarding supports one allowlisted HTTPS base URL, up to five AND conditions, a 10-second timeout, and no retries. An empty condition list forwards all new captures; omitted PATCH conditions preserve the current policy.
      operationId: updateBinResponse
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseConfiguration"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [Bins]
      summary: Permanently delete a bin and its retained requests
      operationId: deleteBin
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/bins/{binId}/config:
    parameters:
      - $ref: "#/components/parameters/BinId"
    get:
      tags: [Bins]
      summary: Export portable bin configuration and response rules
      operationId: exportBinConfiguration
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      responses:
        "200":
          description: Version 1 portable configuration; excludes captures, attempts, Freebin credentials, ownership, shares, and internal IDs. User-authored response or destination values may still be sensitive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortableBinConfiguration" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          $ref: "#/components/responses/Unavailable"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Bins]
      summary: Replace portable bin configuration and response rules
      description: Atomically replaces the bin name, fallback response, forwarding settings, and ordered response rules. Captures and replay history are preserved.
      operationId: importBinConfiguration
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortableBinConfiguration" }
      responses:
        "200":
          description: Configuration replaced
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - importedRules
                properties:
                  ok:
                    type: boolean
                    const: true
                  importedRules:
                    type: integer
                    minimum: 0
                    maximum: 10
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Account rule limit would be exceeded }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          $ref: "#/components/responses/Unavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/bins/{binId}/rules:
    parameters:
      - $ref: "#/components/parameters/BinId"
    get:
      tags: [Bins]
      summary: List conditional response rules in evaluation order
      operationId: listResponseRules
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      responses:
        "200":
          description: Rules and applicable limits
          content:
            application/json:
              schema:
                type: object
                required:
                  - rules
                  - limits
                properties:
                  rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResponseRule"
                  limits:
                    $ref: "#/components/schemas/RuleLimits"
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [Bins]
      summary: Create a conditional response rule
      operationId: createResponseRule
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponseRuleInput" }
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                type: object
                required:
                  - rule
                properties:
                  rule:
                    $ref: "#/components/schemas/ResponseRule"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Rule limit reached }
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Bins]
      summary: Replace response-rule evaluation order
      operationId: reorderResponseRules
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ruleIds]
              properties:
                ruleIds:
                  type: array
                  items: { type: string }
                  uniqueItems: true
                  maxItems: 10
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503":
          $ref: "#/components/responses/Unavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/bins/{binId}/rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/BinId"
      - name: ruleId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Bins]
      summary: Update a conditional response rule
      operationId: updateResponseRule
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseRuleUpdate"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Bins]
      summary: Delete a conditional response rule
      operationId: deleteResponseRule
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/bins/{binId}/rules/test:
    parameters:
      - $ref: "#/components/parameters/BinId"
    post:
      tags: [Bins]
      summary: Test a synthetic request against enabled rules
      operationId: testResponseRules
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleTestRequest" }
      responses:
        "200":
          description: First matching enabled rule, or null
          content:
            application/json:
              schema:
                type: object
                required:
                  - matched
                properties:
                  matched:
                    oneOf:
                      - type: "null"
                      - type: object
                        required:
                          - id
                          - name
                          - revision
                          - responseStatus
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          revision:
                            type: integer
                          responseStatus:
                            type: integer
        "503":
          $ref: "#/components/responses/Unavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/bins/{binId}/interactions:
    parameters:
      - $ref: "#/components/parameters/BinId"
    get:
      tags: [Requests]
      summary: List retained requests
      operationId: listRequests
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      parameters:
        - name: limit
          in: query
          schema:
            oneOf:
              - type: integer
                minimum: 1
                maximum: 100
              - type: string
                enum: [all]
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Newest requests first
          content:
            application/json:
              schema:
                type: object
                required:
                  - meta
                  - interactions
                properties:
                  meta:
                    type: object
                    required: [total, limit, offset]
                    properties:
                      total:
                        type: integer
                      limit:
                        oneOf:
                          - type: integer
                          - type: string
                            enum: [all]
                      offset:
                        type: integer
                  interactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/CapturedRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/bins/{binId}/stream:
    parameters:
      - $ref: "#/components/parameters/BinId"
    get:
      tags: [Requests]
      summary: Stream request-created events
      operationId: streamRequests
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      parameters:
        - name: lastId
          in: query
          description: Last observed request ID; suppresses an immediate duplicate event after reconnecting.
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          description: Last observed request ID; takes precedence over lastId.
          schema:
            type: string
      responses:
        "200":
          description: Server-sent events; each request event contains a request ID
          content:
            text/event-stream:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: Database unavailable
          content:
            text/plain:
              schema:
                type: string
  /api/v1/bins/{binId}/interactions/{requestId}:
    parameters:
      - $ref: "#/components/parameters/BinId"
      - $ref: "#/components/parameters/RequestId"
    delete:
      tags: [Requests]
      summary: Permanently delete one retained request
      operationId: deleteRequest
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/bins/{binId}/export:
    parameters:
      - $ref: "#/components/parameters/BinId"
    get:
      tags: [Requests]
      summary: Export a bin and all retained requests
      operationId: exportBin
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      responses:
        "200":
          description: JSON download
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportedAt:
                    type: string
                    format: date-time
                  bin:
                    $ref: "#/components/schemas/ExportBin"
                  requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/CapturedRequest"
                  rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExportResponseRule"
                  replayAttempts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExportReplayAttempt"
                  forwardAttempts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExportForwardAttempt"
                required:
                  - exportedAt
                  - bin
                  - rules
                  - requests
                  - replayAttempts
                  - forwardAttempts
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/bins/{binId}/interactions/{requestId}/export:
    parameters:
      - $ref: "#/components/parameters/BinId"
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [Requests]
      summary: Export one retained request
      operationId: exportRequest
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      responses:
        "200":
          description: JSON download
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportedAt:
                    type: string
                    format: date-time
                  binId:
                    type: string
                  request:
                    $ref: "#/components/schemas/CapturedRequest"
                  replayAttempts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReplayAttempt"
                  forwardAttempts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ForwardAttempt"
                required:
                  - exportedAt
                  - binId
                  - request
                  - replayAttempts
                  - forwardAttempts
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/bins/{binId}/interactions/{requestId}/replay:
    parameters:
      - $ref: "#/components/parameters/BinId"
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [Requests]
      summary: List retained replay attempts for a captured request
      operationId: listReplayAttempts
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      responses:
        "200":
          description: Newest retained attempts first
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempts:
                    type: array
                    items: { $ref: "#/components/schemas/ReplayAttempt" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [Requests]
      summary: Replay or manually forward one captured request
      operationId: replayRequest
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayInput"
      responses:
        "200":
          description: Destination response summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Destination transport failed; attempt details are returned even when retention immediately removes the record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
      description: Replay requires a public HTTPS target whose origin is allowed by this deployment. Manual forwarding uses the configured forwarding URL and requires forwarding to be enabled. Both operations preserve an attempt record, use a 10-second timeout without following redirects, and apply egress rate limits. Destination HTTP errors still return 200 with the destination status; transport failures return 502.
  /api/v1/bins/{binId}/interactions/{requestId}/forwarding:
    parameters:
      - $ref: "#/components/parameters/BinId"
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [Requests]
      summary: List automatic-forwarding attempts for a captured request
      description: Returns up to 50 automatic-forwarding attempts, newest attempt number first. Each automatic forward currently creates one attempt without retries.
      operationId: listForwardingAttempts
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      responses:
        "200":
          description: Automatic-forwarding attempt history
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempts:
                    type: array
                    items: { $ref: "#/components/schemas/ForwardAttempt" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/bins/{binId}/share:
    parameters:
      - $ref: "#/components/parameters/BinId"
    post:
      tags: [Sharing]
      summary: Enable, rotate, or disable a public bin link
      operationId: shareBin
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareInput"
      responses:
        "200":
          $ref: "#/components/responses/Share"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/bins/{binId}/collaborators:
    parameters:
      - $ref: "#/components/parameters/BinId"
    get:
      tags: [Sharing]
      summary: List registered users invited to a bin
      operationId: listBinCollaborators
      security:
        - bearerAuth: []
        - cookieAuth: []
        - inspectorToken: []
      responses:
        "200":
          description: Collaborators sorted by email
          content:
            application/json:
              schema:
                type: object
                required:
                  - collaborators
                properties:
                  collaborators:
                    type: array
                    items:
                      $ref: "#/components/schemas/Collaborator"
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [Sharing]
      summary: Invite a registered user or replace their bin permissions
      operationId: putBinCollaborator
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, permissions]
              properties:
                email: { type: string, format: email }
                permissions:
                  $ref: "#/components/schemas/BinPermissions"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No registered user has the supplied email }
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
      description: Requires the bin owner browser session. Invite a registered user with at least one supported permission set to true. API keys and anonymous inspector capabilities cannot change collaborators.
    delete:
      tags: [Sharing]
      summary: Remove a user from a bin
      operationId: deleteBinCollaborator
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId]
              properties:
                collaboratorId: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          $ref: "#/components/responses/Unavailable"
