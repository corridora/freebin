              description: JSON-serialized permission map for shared bins; null for owners.
    ResponseRuleUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
          pattern: \S
          description: Trimmed name, 1–80 UTF-8 bytes.
        enabled:
          type: boolean
        conditions:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/RuleCondition"
        responseStatus:
          type: integer
          minimum: 200
          maximum: 599
        responseBody:
          type: string
          maxLength: 20480
          description: Limited to 20 KiB of UTF-8 bytes.
        responseContentType:
          type: string
          maxLength: 500
          description: Limited to 500 UTF-8 bytes and must be a valid HTTP header value.
        responseHeaders:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 500
          propertyNames:
            pattern: ^[!#$%&'*+.^_`|~0-9A-Za-z-]+$
            not:
              pattern: ^\s*(?:[sS][eE][tT]-[cC][oO][oO][kK][iI][eE]|[cC][oO][nN][tT][eE][nN][tT]-[lL][eE][nN][gG][tT][hH]|[tT][rR][aA][nN][sS][fF][eE][rR]-[eE][nN][cC][oO][dD][iI][nN][gG]|[cC][oO][nN][nN][eE][cC][tT][iI][oO][nN]|[uU][pP][gG][rR][aA][dD][eE])\s*$
          description: At most 20 headers and 4 KiB for the JSON-serialized map. Each value is limited to 500 UTF-8 bytes and must be a valid HTTP header value. Prohibited names match fallback response headers.
        responseDelayMs:
          type: integer
          minimum: 0
          maximum: 5000
      description: Partial update. Omitted fields preserve the current rule; sending enabled alone is valid.
    RuleLimits:
      type: object
      required:
        - enabledPerBin
        - totalPerBin
        - enabledPerAccount
        - totalPerAccount
        - conditions
        - serializedBytes
        - responseBodyBytes
        - responseHeadersBytes
        - delayMs
      properties:
        enabledPerBin:
          type: integer
          const: 5
        totalPerBin:
          type: integer
          const: 10
        enabledPerAccount:
          type: integer
          const: 25
        totalPerAccount:
          type: integer
          const: 50
        conditions:
          type: integer
          const: 5
        serializedBytes:
          type: integer
          const: 8192
        responseBodyBytes:
          type: integer
          const: 20480
        responseHeadersBytes:
          type: integer
          const: 4096
        delayMs:
          type: integer
          const: 5000
    ReplayInput:
      type: object
      properties:
        url:
          type: string
          description: Required and validated as an HTTPS URL for replay; ignored when operation is forward.
        method:
          type: string
          maxLength: 32
          pattern: ^[!#$%&'*+.^_`|~0-9A-Za-z-]+$
        path:
          type: string
          maxLength: 2000
          pattern: ^/
          description: Starts with /; limited to 2,000 UTF-8 bytes.
        query:
          type: object
          additionalProperties:
            oneOf:
              - type: string
                maxLength: 500
              - type: array
                items:
                  type: string
                  maxLength: 500
          propertyNames:
            maxLength: 500
          description: Keys and each value are limited to 500 UTF-8 bytes.
        headers:
          type: object
          maxProperties: 50
          additionalProperties:
            type: string
          description: At most 50 input entries and 16 KiB for the serialized outbound header map. Freebin authorization, hop-by-hop, and tracing headers are stripped.
        body:
          type:
            - string
            - "null"
          maxLength: 1048576
          description: Limited to 1 MiB of UTF-8 bytes; null removes the body. Omitted fields reuse the captured request.
        operation:
          type: string
          enum:
            - replay
            - forward
          default: replay
          description: Forward uses the bin's configured automatic-forwarding destination and header allowlist; url is ignored. Manual forwarding does not apply automatic-forwarding conditions.
      allOf:
        - if:
            properties:
              operation:
                const: forward
            required:
              - operation
          then: {}
          else:
            required:
              - url
            properties:
              url:
                format: uri
                pattern: ^[Hh][Tt][Tt][Pp][Ss]://
    ReplayResult:
      type: object
      required:
        - ok
