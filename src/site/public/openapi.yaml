              type: boolean
            priority:
              type: integer
            revision:
              type: integer
            responseStatus:
              type: integer
            responseBody:
              type: string
            responseContentType:
              type: string
            responseHeaders:
              type: object
              maxProperties: 20
              additionalProperties:
                type: string
                maxLength: 500
              propertyNames:
                pattern: ^[!#$%&'*+.^_`|~0-9A-Za-z-]+$
                not:
                  pattern: ^\s*(?:[sS][eE][tT]-[cC][oO][oO][kK][iI][eE]|[cC][oO][nN][tT][eE][nN][tT]-[lL][eE][nN][gG][tT][hH]|[tT][rR][aA][nN][sS][fF][eE][rR]-[eE][nN][cC][oO][dD][iI][nN][gG]|[cC][oO][nN][nN][eE][cC][tT][iI][oO][nN]|[uU][pP][gG][rR][aA][dD][eE])\s*$
              description: At most 20 headers and 4 KiB for the JSON-serialized map. Each value is limited to 500 UTF-8 bytes and must be a valid HTTP header value. Prohibited names match fallback response headers.
            responseDelayMs:
              type: integer
    ExportReplayAttempt:
      allOf:
        - $ref: "#/components/schemas/ReplayAttempt"
        - type: object
          required:
            - requestId
          properties:
            requestId:
              type: string
    ExportForwardAttempt:
      allOf:
        - $ref: "#/components/schemas/ForwardAttempt"
        - type: object
          required:
            - requestId
          properties:
            requestId:
              type: string
    BinPermissions:
      type: object
      additionalProperties: false
      properties:
        bin.view:
          type: boolean
        bin.edit:
          type: boolean
        requests.view:
          type: boolean
        requests.delete:
          type: boolean
        exports.view:
          type: boolean
        exports.edit:
          type: boolean
        replay.view:
          type: boolean
        replay.edit:
          type: boolean
        replay.delete:
          type: boolean
        forwarding.view:
          type: boolean
        forwarding.edit:
          type: boolean
        forwarding.delete:
          type: boolean
        rules.view:
          type: boolean
        rules.edit:
          type: boolean
        rules.delete:
          type: boolean
        config.view:
          type: boolean
        config.edit:
          type: boolean
        sharing.view:
          type: boolean
        sharing.edit:
          type: boolean
        sharing.delete:
          type: boolean
        collaborators.view:
