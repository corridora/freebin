      description: Service limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Present when the handler supplies a retry delay; not all rate-limit responses include this header.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource already exists or an account limit was reached
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: A required service or configuration is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Request body exceeds the applicable account or demo limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
