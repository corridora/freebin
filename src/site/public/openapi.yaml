components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: freebin API key
      description: "Account API key in Authorization: Bearer <key>. Capture requires a key belonging to the destination owner, except the designated public-demo key. Bin listing also accepts an anonymous bin owner capability and returns an empty list for an unrecognized nonempty key."
    cookieAuth:
      type: apiKey
      in: cookie
      name: freebin_session
    inspectorToken:
      type: http
      scheme: bearer
      bearerFormat: Freebin anonymous inspector capability
      description: "Anonymous bin owner capability in Authorization: Bearer <token>. Supported bin-management handlers also accept the bin-specific freebin_inspector_<binId> cookie issued by visiting inspectUrl. A token query parameter alone does not authenticate API requests."
  parameters:
    BinId:
      name: binId
      in: path
      required: true
      schema:
        type: string
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Optional machine-readable error code.
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
    RegisterInput:
      type: object
      required: [email, password, termsAccepted]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
        termsAccepted:
          type: boolean
          const: true
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    PublicConfig:
      type: object
      required:
        - rumScriptUrl
        - rumAppName
        - deploymentEnvironment
        - appVersion
        - signupsEnabled
      properties:
        rumScriptUrl:
          type:
            - string
            - "null"
          format: uri
          description: Public browser RUM script URL.
        rumAppName:
          type: string
        deploymentEnvironment:
          type: string
        appVersion:
          type:
            - string
            - "null"
        signupsEnabled:
          type: boolean
    ApiKey:
      type: object
      required: [id, name, prefix, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
    Account:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            storageLimitBytes:
              type: integer
            storageUsedBytes:
              type: integer
    AccountResponse:
      type: object
      required: [user, bins]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/Account"
            - type: "null"
        bins:
          type: array
          items:
            $ref: "#/components/schemas/AccountBin"
    BinSummary:
      type: object
      required: [binId, name, createdAt]
      properties:
        binId:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        interactionCount:
          type: integer
    Bin:
      allOf:
        - $ref: "#/components/schemas/BinSummary"
        - type: object
          properties:
            responseStatus:
              type: integer
            responseBody:
              type: string
            responseContentType:
              type: string
            responseHeaders:
              type: object
              additionalProperties:
                type: string
            publicShareToken:
              type: [string, "null"]
            forwardingEnabled:
              type: boolean
            forwardingUrl:
              type: [string, "null"]
            forwardingAuthHeaders:
              type: array
              items:
                type: string
              description: Credential-like request headers to retain. Authorization is always removed because it carries the Freebin API key.
            forwardingConditions:
              $ref: "#/components/schemas/ForwardingConditions"
    CreateBinResponse:
      type: object
      required: [bin, inspectUrl]
      properties:
        bin:
          allOf:
            - $ref: "#/components/schemas/BinSummary"
            - type: object
              properties:
                url:
                  type: string
                  format: uri
        inspectUrl:
          type: string
          format: uri
        token:
          type: string
          description: One-time anonymous inspector token; omitted for user-owned bins.
    CapturedRequest:
      type: object
      required: [id, method, path, headers, query, timestamp, sizeBytes]
      properties:
        id:
          type: string
        method:
          type: string
        path:
          type: string
        query:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type:
            - string
            - "null"
          description: Null for captures without a body (including GET and HEAD); gzip captures use the application compressed-body encoding.
        contentType:
          type: [string, "null"]
        remoteAddress:
          type: [string, "null"]
        timestamp:
          type: string
          format: date-time
        sizeBytes:
          type: integer
        publicShareToken:
          type: [string, "null"]
        forwardStatus:
          type: [string, "null"]
          enum: [pending, delivered, failed, null]
        forwardStatusCode:
          type: [integer, "null"]
        forwardError:
          type: [string, "null"]
        forwardedAt:
          type: [string, "null"]
          format: date-time
        forwardDurationMs:
          type: [integer, "null"]
        matchedRuleId:
          type: [string, "null"]
        matchedRuleName:
          type: [string, "null"]
        matchedRuleRevision:
          type: [integer, "null"]
    ReplayAttempt:
      type: object
      required:
        [
          id,
          operation,
          targetUrl,
          method,
          path,
          query,
          headers,
          durationMs,
          sizeBytes,
          createdAt,
        ]
      properties:
        id: { type: string }
        operation: { type: string, enum: [replay, forward] }
        targetUrl: { type: string, format: uri }
        method: { type: string }
        path: { type: string }
        query: { type: object, additionalProperties: true }
        headers: { type: object, additionalProperties: { type: string } }
        body: { type: [string, "null"] }
        responseStatus: { type: [integer, "null"] }
        responseStatusText: { type: [string, "null"] }
        error: { type: [string, "null"] }
        durationMs: { type: integer }
        sizeBytes: { type: integer }
        createdAt: { type: string, format: date-time }
    ForwardAttempt:
      type: object
      required: [id, attemptNumber, status, startedAt]
      properties:
        id: { type: string }
        attemptNumber: { type: integer, minimum: 1 }
        targetUrl:
          type: [string, "null"]
          format: uri
          description: Null only for records backfilled from before destination history was retained.
        status: { type: string, enum: [pending, delivered, failed] }
        responseStatus: { type: [integer, "null"] }
        error: { type: [string, "null"] }
        durationMs: { type: [integer, "null"] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    AuditEvent:
      type: object
      required: [id, actorType, action, targetType, metadata, createdAt]
      properties:
        id: { type: string }
        actorEmail: { type: [string, "null"], format: email }
        actorType: { type: string, enum: [session, api_key, inspector] }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: [string, "null"] }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    RuleCondition:
      $ref: ./schemas/bin-config.v1.json#/$defs/condition
    ResponseRuleInput:
      type: object
      required:
        - name
        - conditions
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
          pattern: \S
          description: Trimmed name, 1–80 UTF-8 bytes.
        enabled:
          type: boolean
          default: true
        conditions:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/RuleCondition"
        responseStatus:
          type: integer
          minimum: 200
          maximum: 599
          default: 200
        responseBody:
          type: string
          maxLength: 20480
          default: ""
          description: Limited to 20 KiB of UTF-8 bytes.
        responseContentType:
          type: string
          maxLength: 500
          default: text/plain; charset=utf-8
          description: Limited to 500 UTF-8 bytes and must be a valid HTTP header value.
        responseHeaders:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 500
          propertyNames:
            pattern: ^[!#$%&'*+.^_`|~0-9A-Za-z-]+$
            not:
              pattern: ^\s*(?:[sS][eE][tT]-[cC][oO][oO][kK][iI][eE]|[cC][oO][nN][tT][eE][nN][tT]-[lL][eE][nN][gG][tT][hH]|[tT][rR][aA][nN][sS][fF][eE][rR]-[eE][nN][cC][oO][dD][iI][nN][gG]|[cC][oO][nN][nN][eE][cC][tT][iI][oO][nN]|[uU][pP][gG][rR][aA][dD][eE])\s*$
          description: At most 20 headers and 4 KiB for the JSON-serialized map. Each value is limited to 500 UTF-8 bytes and must be a valid HTTP header value. Prohibited names match fallback response headers.
          default: {}
        responseDelayMs:
          type: integer
          minimum: 0
          maximum: 5000
          default: 0
      description: Create input. Name and conditions are required; omitted response fields use defaults. Names and other textual limits are enforced in UTF-8 bytes.
    ForwardingConditions:
      type: array
      maxItems: 5
      default: []
      description: All conditions must match for automatic forwarding. An empty list forwards every new capture. Conditions share response-rule matching semantics; query/header/body require a key, header names are case-insensitive, JSON fields use dot notation, and authorization/proxy-authorization/cookie headers cannot be inspected. Keys and values are limited to 500 UTF-8 bytes. Compressed bodies cannot match body conditions. Manual replay and bulk forwarding bypass these conditions.
      items:
        $ref: "#/components/schemas/RuleCondition"
    ResponseRule:
      allOf:
        - $ref: "#/components/schemas/ResponseRuleInput"
        - type: object
          required:
            - id
            - priority
            - revision
            - createdAt
            - updatedAt
            - name
            - enabled
            - conditions
            - responseStatus
            - responseBody
            - responseContentType
            - responseHeaders
            - responseDelayMs
          properties:
            id:
              type: string
            priority:
              type: integer
            revision:
              type: integer
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    RuleTestRequest:
      type: object
      properties:
        method: { type: string }
        path: { type: string }
        query:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        body: { type: [string, "null"] }
        contentType: { type: string }
    PortableBinConfiguration:
      $ref: ./schemas/bin-config.v1.json
    ResponseConfiguration:
      type: object
      properties:
        responseStatus:
          type: integer
          minimum: 100
          maximum: 599
        responseBody:
          type: string
          maxLength: 500
          description: Limited to 500 UTF-8 bytes; maxLength is an additional character-count hint.
        responseContentType:
          type: string
          maxLength: 500
          description: Limited to 500 UTF-8 bytes; maxLength is an additional character-count hint.
        responseHeaders:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
          description: After filtering prohibited response headers, at most 20 entries are retained; the serialized map is limited to 500 UTF-8 bytes.
        forwardingEnabled:
          type: boolean
        forwardingUrl:
          type:
            - string
            - "null"
          maxLength: 2000
          description: Null or an empty string clears the destination while forwarding is disabled. Enabling forwarding requires an allowlisted HTTPS URL without embedded credentials. The URL is limited to 2,000 UTF-8 bytes.
        forwardingAuthHeaders:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            pattern: ^[!#$%&'*+.^_`|~0-9A-Za-z-]+$
            not:
              pattern: ^\s*(?:[hH][oO][sS][tT]|[aA][uU][tT][hH][oO][rR][iI][zZ][aA][tT][iI][oO][nN]|[cC][oO][nN][tT][eE][nN][tT]-[lL][eE][nN][gG][tT][hH]|[tT][rR][aA][nN][sS][fF][eE][rR]-[eE][nN][cC][oO][dD][iI][nN][gG]|[cC][oO][nN][nN][eE][cC][tT][iI][oO][nN]|[kK][eE][eE][pP]-[aA][lL][iI][vV][eE]|[pP][rR][oO][xX][yY]-[aA][uU][tT][hH][eE][nN][tT][iI][cC][aA][tT][eE]|[pP][rR][oO][xX][yY]-[aA][uU][tT][hH][oO][rR][iI][zZ][aA][tT][iI][oO][nN]|[tT][eE]|[tT][rR][aA][iI][lL][eE][rR]|[uU][pP][gG][rR][aA][dD][eE]|[cC][fF]-[rR][aA][yY]|[cC][fF]-[cC][oO][nN][nN][eE][cC][tT][iI][nN][gG]-[iI][pP]|[xX]-[fF][oO][rR][wW][aA][rR][dD][eE][dD]-[fF][oO][rR]|[tT][rR][aA][cC][eE][pP][aA][rR][eE][nN][tT]|[tT][rR][aA][cC][eE][sS][tT][aA][tT][eE]|[bB][aA][gG][gG][aA][gG][eE])\s*$
          description: Names are trimmed, lowercased, and deduplicated. Freebin authorization, hop-by-hop, source-address, and tracing headers cannot be retained; other sensitive headers are retained only when listed here.
        forwardingConditions:
          $ref: "#/components/schemas/ForwardingConditions"
    ShareInput:
      type: object
      required: [public]
      properties:
        public:
          type: boolean
    ShareResponse:
      type: object
      properties:
        public:
          type: boolean
        shareUrl:
          type: [string, "null"]
          format: uri
    AccountBin:
      allOf:
        - $ref: "#/components/schemas/BinSummary"
        - type: object
          required:
            - publicShareToken
            - ownerEmail
            - isOwner
            - permissions
          properties:
            publicShareToken:
              type:
                - string
                - "null"
            ownerEmail:
              type: string
              format: email
            isOwner:
              type: integer
              enum:
                - 0
                - 1
            permissions:
              type:
                - string
